name: CI

# Runs on every push to `dev` and on PRs targeting `dev` or `main`.
# Windows and macOS use their hosted toolchains; Linux uses the repository's locked Nix shell so
# GPUI's Wayland/X11/Vulkan dependencies match the supported NixOS development environment.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debuginfo is a large share of a debug build — generating it, and on Windows writing the
  # PDB. Line tables keep backtraces readable and drop the rest. (The dev profile in Cargo.toml
  # already says this; repeated here so it also covers the test profile.)
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No separate `cargo build` step: `clippy --all-targets` above already compiled every
      # target, so building again was a second full build per run for no extra signal.
      - name: Test
        run: cargo test --workspace

  check-linux:
    name: check (linux/nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Format check
        run: nix develop --command cargo fmt --all --check

      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: nix develop --command cargo test --workspace
