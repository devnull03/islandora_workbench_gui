[package]
name = "app"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
dirs.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
ureq.workspace = true
base64.workspace = true

window-wrapper = { path = "../window-wrapper" }
workbench-integration = { path = "../workbench-integration" }
settings = { path = "../settings" }

# Embeds the app icon and version metadata into the Windows .exe at build time.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Reads installer-provided paths from HKLM (UvPath / ProvisionWorkbench).
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
