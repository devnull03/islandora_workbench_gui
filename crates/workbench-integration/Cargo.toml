[package]
name = "workbench-integration"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
which = "7.0"
workbench-preprocessor = { git = "https://github.com/south-asian-canadian-digital-archive/workbench-preprocessor" }
serde_yaml = "0.9"
# serde feature is required by the IndexMap fields in config_builder; previously only present via
# workspace feature unification, which broke when building/testing this crate in isolation.
indexmap = { version = "2.0", features = ["serde"] }
# Download (ureq) + extract (zip) the workbench repo zipball for first-run provisioning.
ureq.workspace = true
base64.workspace = true
zip = "2"
calamine = { version = "0.26", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
# SIGINT to a run's process group: Cancel is Workbench's documented ctrl-c.
libc = "0.2"
