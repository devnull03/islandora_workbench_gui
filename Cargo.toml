[workspace]
resolver = "2"
members = [
  "crates/app",
  "crates/config-builder",
  "crates/settings",
  "crates/ui",
  "crates/workbench-integration",
  "crates/window-wrapper",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"

# Unoptimized gpui — text shaping and layout above all — runs every frame, so a debug build of
# this app is unusably slow before any of our own code is the problem. Dependencies are optimized
# once and then cached; our own crates stay at 1 so recompiles remain fast.
[profile.dev]
opt-level = 1
# Full debuginfo is a large share of a debug build: generating it, and on Windows writing the PDB.
# Line tables keep backtraces readable and drop the rest.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Release artifacts ship to end users, so trade build time for a smaller, faster
# binary. opt-level stays at the default 3 (max speed) — this is a GUI app, so we
# get size from stripping + LTO rather than size-optimized codegen.
#   strip:         drop debug/symbol tables (no runtime cost, big size win)
#   lto = "thin":  cross-crate inlining/dead-code removal (smaller + faster)
#   codegen-units: 1 unit = whole-crate optimization (smaller/faster, slower build)
# panic is intentionally left at the default "unwind" — "abort" can break GPUI's
# panic-catching executors, so it's excluded.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[workspace.dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
schemars = { version = "1.0", features = ["indexmap2"] }
# `json` for the update feed — it is the only response body anything here parses.
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
log = "0.4"
simplelog = "0.12"
os_info = "3"
sysinfo = "0.37"
